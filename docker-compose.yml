services:
  # Evidence store (GB-005). Health-checked so dependents wait for readiness,
  # not merely for the container process to start.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glassbox
      POSTGRES_PASSWORD: glassbox
      POSTGRES_DB: glassbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glassbox -d glassbox"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Distributed limits and baselines (GB-011, GB-022).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible WORM anchor target (GB-007). Object Lock is a Standard/AWS-S3
  # feature MinIO does not emulate identically; local runs exercise the
  # `FilesystemWormAnchorStore` write-once contract instead, and this service
  # exists so an S3-shaped `WormAnchorStore` adapter can be exercised against a
  # real S3 API surface once one is written.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: glassbox
      MINIO_ROOT_PASSWORD: glassbox123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
