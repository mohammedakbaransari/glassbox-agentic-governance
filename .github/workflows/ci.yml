name: GlassBox CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to actions/checkout v4.2.2 (CI-4: supply-chain hardening)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to stable major (v5)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned EXACTLY. An unpinned `black>=24.0` lets CI resolve a newer
      # formatter whose output differs from the committed source, which turns a
      # green build red with no source change. Keep in sync with the `dev` extra
      # in pyproject.toml.
      - name: Install lint tools
        run: |
          pip install black==26.5.1 isort==8.0.1 pylint==4.0.6 mypy==2.3.0

      - name: Check formatting (black)
        run: black --check --line-length 100 glassbox tests

      - name: Check import order (isort)
        run: isort --check-only --profile black --line-length 100 glassbox tests

      - name: Static analysis (pylint)
        run: |
          pylint glassbox \
            --disable=too-many-arguments,too-many-locals,too-many-branches,too-many-statements \
            --disable=too-many-instance-attributes,too-few-public-methods \
            --disable=missing-module-docstring,missing-function-docstring \
            --fail-under=8.0

      - name: Type checking (mypy)
        run: mypy glassbox --ignore-missing-imports --no-error-summary

      # The rebuilt layers are held to a stricter standard than the v1 code they
      # replace; see [[tool.mypy.overrides]] in pyproject.toml.
      - name: Strict type checking (domain + ports)
        run: mypy glassbox/domain glassbox/ports --no-error-summary

  # GB-002/GB-004: the dependency rule `domain <- ports <- app <- adapters` and
  # the banned-construct rules are executable, not advisory.
  architecture:
    name: Architecture Gate
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to stable major (v5)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install pytest ruff==0.16.2 import-linter==2.13

      # The authoritative machine-checked contract. Unlike the AST assertions
      # below it follows transitive import chains, so an adapter reaching v1 code
      # by way of the composition root is caught.
      - name: Enforce the dependency rule (import-linter)
        run: lint-imports

      # Invariant lint: bare except, swallowed exceptions, mutable defaults and
      # threading.local. Narrow by design -- style is covered by the lint job.
      - name: Enforce invariants (ruff)
        run: ruff check --no-cache glassbox tests

      - name: Enforce layering, purity and banned constructs
        run: python -m pytest tests/test_layering.py -v --tb=short

  # GB-001: the package MUST be buildable and installable. The previous build
  # backend (`setuptools.backends.legacy:build`) did not exist, so every
  # documented `pip install -e .` failed while CI stayed green because it only
  # ever imported `glassbox` from the checkout directory.
  build-and-install:
    name: Build & Install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # SHA-pinned to actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to stable major (v5)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Verify exactly one sdist and one wheel were produced
        run: |
          set -euo pipefail
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -name '*.whl'    | wc -l)" -eq 1
          ls -l dist/

      # Installing into a clean venv from a directory that is NOT the checkout
      # proves the wheel is self-contained and that import does not silently
      # resolve against the source tree.
      - name: Install the wheel into a clean virtual environment and import it
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import glassbox, sys; print('glassbox', glassbox.__version__, 'from', glassbox.__file__); sys.exit(0 if 'wheel-venv' in glassbox.__file__ else 1)"

      - name: Verify editable install works (the documented developer workflow)
        run: |
          set -euo pipefail
          python -m venv /tmp/editable-venv
          /tmp/editable-venv/bin/python -m pip install --upgrade pip
          /tmp/editable-venv/bin/python -m pip install -e .
          cd /tmp
          /tmp/editable-venv/bin/python -c "import glassbox; print('editable ok:', glassbox.__version__)"

      - name: Packaging contract tests
        run: |
          python -m pip install pytest "packaging>=23.0" "setuptools>=68" "tomli>=2.0; python_version < '3.11'"
          GLASSBOX_RUN_BUILD_TESTS=1 python -m pytest tests/test_packaging.py -v --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to stable major (v5)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install "bandit>=1.7" "pip-audit>=2.0"

      - name: Security scan (bandit)
        run: |
          bandit -r glassbox \
            --skip B101,B311 \
            --severity-level medium \
            --confidence-level medium

      # CI-3: Scan installed dependencies for known CVEs
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install "flask>=3.0.0,<5.0" "pyyaml>=6.0,<7.0" \
            "cryptography>=42.0.0,<46.0" "redis>=5.0.0,<6.0"
          # --require-hashes is a boolean store_true flag in pip-audit's CLI (no
          # `=false` form); omitting it already means hashes are not required.
          pip-audit --progress-spinner off

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # SHA-pinned to actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to stable major (v5)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov \
            "flask>=3.0.0,<5.0" \
            "pyyaml>=6.0,<7.0" \
            "cryptography>=42.0.0,<46.0"

      # T-1: Coverage threshold raised to 80% (aligned with pyproject.toml)
      - name: Run all tests with coverage
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=glassbox \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      # SHA-pinned to actions/upload-artifact v4.6.0
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run examples
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
        run: python examples/industry_examples.py

      - name: Run benchmarks
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
        run: python -m glassbox.benchmarks.run_benchmarks

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to stable major (v5)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest "hypothesis>=6.0" \
            "flask>=3.0.0,<5.0" \
            "cryptography>=42.0.0,<46.0"

      # T-2: Remove the `|| echo "...skipping"` fallback — real failures must fail the build.
      # The test file is checked for existence first; if absent the step is truly skipped.
      - name: Run property-based tests
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
        run: |
          if [ -f tests/test_property.py ]; then
            python -m pytest tests/test_property.py -v --tb=short --hypothesis-seed=0
          else
            echo "tests/test_property.py not found — skipping property tests"
          fi

  # GB-035: every "real backend" claim (GB-005 Postgres, GB-011/GB-022 Redis)
  # is proven against the actual service, not a fake, in CI on every push. The
  # same images are in docker-compose.yml for local reproduction of this exact
  # environment.
  integration:
    name: Integration Tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glassbox
          POSTGRES_PASSWORD: glassbox
          POSTGRES_DB: glassbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glassbox -d glassbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest "psycopg[binary,pool]>=3.1,<4.0" "redis>=5.0.0,<6.0"

      - name: Run Postgres evidence store integration tests
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
          GLASSBOX_POSTGRES_DSN: postgresql://glassbox:glassbox@localhost:5432/glassbox
        run: python -m pytest tests/test_postgres_evidence.py -v --tb=short

      - name: Run Redis limit store integration tests
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
          GLASSBOX_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/test_redis_limits.py -v --tb=short

      - name: Run Redis baseline store integration tests
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
          GLASSBOX_REDIS_URL: redis://localhost:6379/1
        run: python -m pytest tests/test_redis_baseline.py -v --tb=short

      - name: Run dispatcher idempotency and admission-control tests
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
        run: python -m pytest tests/test_dispatcher_idempotency.py tests/test_batch_admission_control.py -v --tb=short

      # GB-035/GB-011 (S4): 3+ replicas as real OS processes, not threads,
      # against the real Redis service above.
      - name: Run multi-process distributed limits test
        env:
          GLASSBOX_LOG_LEVEL: CRITICAL
          GLASSBOX_REDIS_URL: redis://localhost:6379/2
        run: python -m pytest tests/test_multiprocess_limits.py -v --tb=short

  # GB-038: supply-chain gates.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # SHA-pinned to gitleaks/gitleaks-action v3.0.0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # SHA-pinned to actions/dependency-review-action v5.0.0
      - name: Review dependency changes for known vulnerabilities and license issues
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  lockfile:
    name: Lockfile Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # requirements-lock.txt is the hash-pinned resolution of the `dev` extra
      # (CI/dev tooling only -- the package itself ships with zero mandatory
      # dependencies, per pyproject.toml's `dependencies = []`). Use the
      # committed lock as a constraint: an unconstrained compile upgrades every
      # transitive package as soon as a release appears and makes main fail even
      # when pyproject.toml did not change.
      - name: Regenerate the lockfile and check for drift
        run: |
          candidate="$(mktemp)"
          committed="$(mktemp)"
          uv pip compile pyproject.toml --extra dev --generate-hashes \
            --constraint requirements-lock.txt \
            --no-header \
            --output-file "$candidate"
          tail -n +3 requirements-lock.txt > "$committed"
          if ! cmp --silent "$committed" "$candidate"; then
            echo "::error::requirements-lock.txt is stale. Regenerate with:"
            echo "  uv pip compile pyproject.toml --extra dev --generate-hashes --output-file requirements-lock.txt"
            diff --unified "$committed" "$candidate" || true
            exit 1
          fi
